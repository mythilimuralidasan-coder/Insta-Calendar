<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOMO — Content Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1c1a30;
    --ink-soft: #726f8c;
    --border: #ece8fb;
    --surface: #ffffff;

    --coral: #ff3b5c;      --coral-bg: #ffc2cd;
    --amber: #ff8a00;      --amber-bg: #ffd699;
    --lime:  #2fa83f;      --lime-bg:  #b9edb0;
    --cobalt:#1c7dff;      --cobalt-bg:#b9d9ff;
    --violet:#7c3aed;      --violet-bg:#d9c4fc;
    --slate: #64748b;      --slate-bg: #dfe4ea;
    --yellow:#eab308;      --yellow-bg:#fdf0a5;
    --magenta:#e0299c;     --magenta-bg:#f7bfe1;
    --teal:  #14b8a6;      --teal-bg:  #b7ede6;

    --pending: #9b96b8;    --pending-bg: #eceafa;
    --progress: #ff9f1c;   --progress-bg: #ffedd4;
    --posted: #4cb944;     --posted-bg: #dff5da;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; color: var(--ink);
    font-family:'Inter', sans-serif;
    padding: 32px 24px 70px;
    background:
      radial-gradient(1100px 650px at 0% -10%, #baf3d3 0%, transparent 60%),
      radial-gradient(1000px 600px at 100% -5%, #ffd9a0 0%, transparent 58%),
      radial-gradient(900px 700px at 100% 55%, #d6c3fb 0%, transparent 55%),
      radial-gradient(1000px 750px at 0% 60%, #ffc3d6 0%, transparent 55%),
      radial-gradient(1100px 800px at 50% 115%, #b8dcff 0%, transparent 55%),
      #f6f3ff;
    background-attachment: fixed;
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after{
    content:""; position:fixed; border-radius:50%; filter: blur(2px); opacity:0.5; z-index:-1;
  }
  body::before{ width:340px; height:340px; background: var(--amber-bg); top:-120px; right:-100px; }
  body::after{ width:280px; height:280px; background: var(--cobalt-bg); bottom:-90px; left:-90px; }
  .wrap{ max-width: 820px; margin: 0 auto; background: rgba(255,255,255,0.55); backdrop-filter: blur(6px); border-radius: 32px; padding: 32px 32px 8px; border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 30px 60px -30px rgba(28,26,48,0.25); }

  .top{ margin-bottom: 28px; }
  .brand img{ height: 40px; width: auto; display:block; margin-bottom: 18px; }
  h1{ font-family:'Poppins', sans-serif; font-size: 34px; font-weight:700; margin: 0 0 6px; letter-spacing:-0.01em; }
  .range{ color: var(--ink-soft); font-size: 15px; }

  /* calendar grid */
  .strip{
    display:grid; grid-template-columns: repeat(2, 1fr);
    gap: 26px; padding: 8px 4px 26px;
  }
  @media (max-width: 620px){ .strip{ grid-template-columns: 1fr; } }
  .daycol{
    background: rgba(255,255,255,0.5); border:1px dashed var(--border); border-radius: 24px;
    padding: 22px 22px 24px;
    display:flex; flex-direction:column;
  }
  .daytag{ text-align:center; margin-bottom: 20px; }
  .daytag .dow{ font-size: 14px; font-weight:700; color: var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:9px; }
  .daytag .num{
    width: 60px; height:60px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    margin: 0 auto; font-family:'Poppins', sans-serif; font-weight:700;
    background: var(--surface); border: 1px solid var(--border); color: var(--ink);
  }
  .daytag .num .d{ font-size: 20px; line-height:1; }
  .daytag .num .m{ font-size: 9.5px; letter-spacing:0.05em; color: var(--ink-soft); font-weight:700; margin-top:2px; }

  .card{
    background: var(--card-bg, var(--surface)); border-radius: 18px; padding: 22px 22px 24px;
    box-shadow: 0 12px 26px -12px rgba(28,26,48,0.32);
    display:flex; flex-direction:column; justify-content:space-between;
    flex: 1; min-height: 220px;
  }
  .card .cattag{ display:inline-block; font-size: 12px; font-weight:700; padding:5px 12px; border-radius:100px; margin-bottom: 14px; background: rgba(255,255,255,0.75); align-self:flex-start; outline:none; }
  .card .cattag:hover{ box-shadow: 0 0 0 1px rgba(0,0,0,0.08); }
  .card .cattag:focus{ box-shadow: 0 0 0 2px rgba(0,0,0,0.12); }
  .card .card-body{ flex: 1; display:flex; flex-direction:column; }
  .turtle-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding: 4px 0 8px; }
  .turtle-figure{ position:relative; width: 118px; aspect-ratio: 328 / 287; }
  .turtle-body-img{ position:absolute; inset:0; width:100%; height:100%; }
  .turtle-arm-img{
    position:absolute;
    left: 64.63%; top: 63.07%; width: 19.21%; height: 29.97%;
    transform-origin: 49.2% 2.3%;
  }
  .card h4{ font-family:'Poppins', sans-serif; font-size: 18px; font-weight:600; line-height:1.42; margin: 0; color: var(--ink); outline:none; }
  .card h4[contenteditable="true"]:hover{ background: rgba(255,255,255,0.4); border-radius: 6px; }
  .card h4[contenteditable="true"]:focus{ background: rgba(255,255,255,0.65); border-radius: 6px; box-shadow: 0 0 0 2px rgba(0,0,0,0.08); }

  /* status control */
  .status-wrap{ position:relative; }
  .status-pill{
    border:none; cursor:pointer; font-family:'Inter',sans-serif; font-weight:700; font-size: 11px;
    padding: 6px 10px; border-radius: 100px; display:inline-flex; align-items:center; gap:6px;
    width:100%; justify-content:center;
  }
  .status-pill .sw{ width:7px; height:7px; border-radius:50%; }
  .status-pill.pending{ background: var(--pending-bg); color:#5b5776; }
  .status-pill.pending .sw{ background: var(--pending); }
  .status-pill.progress{ background: var(--progress-bg); color:#a15f00; }
  .status-pill.progress .sw{ background: var(--progress); }
  .status-pill.posted{ background: var(--posted-bg); color:#207032; }
  .status-pill.posted .sw{ background: var(--posted); }

  .status-menu{
    position:absolute; left:0; right:0; top: calc(100% + 6px); z-index: 20;
    background: var(--surface); border:1px solid var(--border); border-radius: 12px;
    box-shadow: 0 16px 30px -14px rgba(28,26,48,0.35); padding: 6px; display:none;
  }
  .status-menu.open{ display:block; }
  .status-opt{
    display:flex; align-items:center; gap:8px; padding: 8px 9px; border-radius:8px; cursor:pointer;
    font-size: 12px; font-weight:600; color: var(--ink);
  }
  .status-opt:hover{ background: #f4f2ff; }
  .status-opt .sw{ width:8px; height:8px; border-radius:50%; }
  .status-opt.selected{ background: #f4f2ff; }

</style>
</head>

/* ====== FIREBASE SETUP ======
   1. Go to https://console.firebase.google.com → Create a project (free).
   2. Inside the project, click "Build > Realtime Database" → Create Database → start in test mode.
   3. Go to Project settings (gear icon) → General → "Your apps" → Add app → Web (</>) → register it.
   4. Copy the firebaseConfig object it gives you and paste it below, replacing the placeholder.
   5. Commit + push — every edit made on the live site will now sync to everyone who opens it.
   Until you do this, the page will just show posts without saving edits anywhere shared.
*/
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://PASTE_YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "PASTE_YOUR_PROJECT",
  storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};

let db = null;
let dbRef = null;
let fbReady = false;

async function initFirebase(){
  if(firebaseConfig.apiKey === "PASTE_YOUR_API_KEY"){
    return;
  }
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getDatabase, ref, onValue, set } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    dbRef = ref(db, "jomoCalendar/posts");
    window.__fbSet = set;
    window.__fbRef = ref;
    window.__fbDb = db;

    onValue(dbRef, (snapshot) => {
      const saved = snapshot.val();
      if(saved){
        posts.forEach(p => {
          const s = saved[p.id];
          if(s){
            if(typeof s.title === "string") p.title = s.title;
            if(typeof s.catLabel === "string") p.catLabel = s.catLabel;
            if(typeof s.status === "string") p.status = s.status;
          }
        });
      }
      fbReady = true;
      renderStrip();
    });
  }catch(e){
    console.error(e);
  }
}

function renderStrip(){
  const strip = document.getElementById('strip');
  strip.innerHTML = posts.map(p => {
    const c = categories[p.cat];
    const catText = (p.catLabel !== undefined) ? p.catLabel : (c.emoji + ' ' + c.label);
    const titleHtml = (p.cat === "static")
      ? `<div class="turtle-wrap"><div class="turtle-figure">${TURTLE_BODY_IMG}${TURTLE_ARM_IMG}</div></div>`
      : `<h4 contenteditable="true" spellcheck="false" onblur="saveTitle(${p.id}, this)">${p.title}</h4>`;
    return `
      <div class="daycol">
        <div class="daytag">
          <div class="dow">${p.dow}</div>
          <div class="num"><span class="d">${p.num}</span><span class="m">${p.mon}</span></div>
        </div>
        <div class="card" style="--card-bg:${c.bg}">
          <div class="card-body">
            <span class="cattag" contenteditable="true" spellcheck="false" style="color:${c.color}" onblur="saveCat(${p.id}, this)">${catText}</span>
            ${titleHtml}
          </div>
          <div class="status-wrap">
            <button class="status-pill ${p.status}" onclick="toggleMenu(event, ${p.id})">
              <span class="sw"></span>${stageLabel[p.status]}
            </button>
            <div class="status-menu" id="menu-${p.id}">
              ${stageOrder.map(s => `
                <div class="status-opt ${p.status===s?'selected':''}" onclick="setStatus(event, ${p.id}, '${s}')">
                  <span class="sw status-${s}" style="background:var(--${s})"></span>${stageLabel[s]}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function closeAllMenus(except){
  document.querySelectorAll('.status-menu').forEach(m => {
    if(m.id !== except) m.classList.remove('open');
  });
}

function toggleMenu(e, id){
  e.stopPropagation();
  const menu = document.getElementById('menu-'+id);
  const isOpen = menu.classList.contains('open');
  closeAllMenus();
  menu.classList.toggle('open', !isOpen);
}

function pushToFirebase(id){
  if(!db || !dbRef || firebaseConfig.apiKey === "PASTE_YOUR_API_KEY") return;
  const post = posts.find(p => p.id === id);
  const path = window.__fbRef(window.__fbDb, "jomoCalendar/posts/" + id);
  window.__fbSet(path, { title: post.title, catLabel: post.catLabel || null, status: post.status });
}

function setStatus(e, id, status){
  e.stopPropagation();
  const post = posts.find(p => p.id === id);
  post.status = status;
  renderStrip();
  pushToFirebase(id);
}

function saveTitle(id, el){
  const post = posts.find(p => p.id === id);
  post.title = el.innerText.trim();
  pushToFirebase(id);
}

function saveCat(id, el){
  const post = posts.find(p => p.id === id);
  post.catLabel = el.innerText.trim();
  pushToFirebase(id);
}

document.addEventListener('click', () => closeAllMenus());

renderStrip();
initFirebase();

window.setStatus = setStatus;
window.toggleMenu = toggleMenu;
window.saveTitle = saveTitle;
window.saveCat = saveCat;

</script>
